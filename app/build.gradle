plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.magneticlab.v1'
    compileSdk 35

    defaultConfig {
        applicationId 'com.magneticlab.v1'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def decodeMagneticAppIcon = tasks.register('decodeMagneticAppIcon') {
    inputs.file(file('src/main/res/raw/magnetic_app_icon.b64'))
    outputs.file(file('src/main/res/drawable-nodpi/magnetic_app_icon.jpg'))
    doLast {
        def input = file('src/main/res/raw/magnetic_app_icon.b64')
        def output = file('src/main/res/drawable-nodpi/magnetic_app_icon.jpg')
        output.parentFile.mkdirs()
        output.bytes = java.util.Base64.decoder.decode(input.text.trim())
    }
}

tasks.named('preBuild') {
    dependsOn(decodeMagneticAppIcon)
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
